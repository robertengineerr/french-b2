name: Rebuild sentence bank

# Downloads the Tatoeba FR-EN pairs, filters them down to sentences containing a
# word the app teaches, and commits public/content/sentences.json.
#
# This runs here rather than locally because it needs to reach an external corpus
# host, and because the result is a build input everyone shares — regenerating it
# on a runner means the committed file is always reproducible from the script.
#
# Run it manually from the Actions tab, and once a quarter on its own so a new
# content pack's vocabulary picks up sentences without anyone remembering to.
on:
  workflow_dispatch:
    inputs:
      per_word:
        description: 'Sentences kept per word'
        required: false
        default: '3'
  schedule:
    - cron: '17 4 1 */3 *'

permissions:
  contents: write
  actions: write # to kick off the deploy after committing (see the last step)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import sentences
        run: node scripts/import-sentences.mjs --per-word "${{ inputs.per_word || '3' }}"

      - name: Commit if changed
        id: commit
        run: |
          test -s public/content/sentences.json  # the importer must have produced it

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/content/sentences.json

          # Compare the INDEX, not the worktree. `git diff` ignores untracked
          # files, so on the first run — when sentences.json isn't in the repo
          # yet — a worktree diff reports "no change" and silently discards a
          # perfectly good bank. Staging first makes a new file show up as one.
          if git diff --cached --quiet -- public/content/sentences.json; then
            echo "Bank unchanged — nothing to commit."
            exit 0
          fi

          SIZE=$(du -h public/content/sentences.json | cut -f1)
          WORDS=$(jq -r .words public/content/sentences.json)
          COUNT=$(jq -r .sentenceCount public/content/sentences.json)
          git commit -m "Rebuild sentence bank: $COUNT sentences over $WORDS words ($SIZE)" \
                     -m "Generated by scripts/import-sentences.mjs from the Tatoeba corpus (CC-BY 2.0 FR)."
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN deliberately does not trigger other
      # workflows, so the new bank would sit in main un-deployed until someone
      # else pushed. Dispatching the deploy explicitly is the fix.
      - name: Deploy the new bank
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
